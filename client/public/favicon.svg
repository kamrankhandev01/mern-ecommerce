<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Astra">
  <title>Astra</title>
  <!--
    Astra mark: a geometric "A" in the brand amber on near-black.

    Drawn as strokes with round caps rather than a font or a filled outline, so
    it renders identically everywhere and stays legible down to 16px in a
    browser tab. Keep the strokes thick and the mark simple: anything finer
    disappears at small sizes.
  -->
  <rect width="32" height="32" rx="7" fill="#17171a"/>
  <g fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 24.5 16 8.5 22.5 24.5"/>
    <path d="M12.8 19.2h6.4" stroke-width="2.6"/>
  </g>
</svg>

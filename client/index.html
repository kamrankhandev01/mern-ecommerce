<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      Icons. The SVG is the modern mark; the .ico and 32px PNG are fallbacks for
      older browsers, and the 180px PNG is what iOS puts on the home screen.
      `mask-icon` gives Safari pinned tabs a monochrome version.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#fcd34d" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Astra" />

    <title>Astra &mdash; Considered pieces for everyday</title>
    <meta
      name="description"
      content="Astra is a small, deliberate shop: useful objects, honest materials, and free shipping over $75."
    />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Astra" />
    <meta property="og:title" content="Astra &mdash; Considered pieces for everyday" />
    <meta
      property="og:description"
      content="Useful objects, honest materials, and free shipping over $75."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#17171a" />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
